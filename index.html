<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HÀNH TRÌNH TRUNG HOA DU KÝ TỰ TÚC 7N6Đ</title>
    <style>
        :root {
            --primary: #c0392b;
            --primary-dark: #962d22;
            --secondary: #d35400;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --border-radius: 16px;
            --shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 20px rgba(192, 57, 43, 0.3);
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .day-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .day-header {
            background: #fff;
            padding: 20px 25px;
            border-bottom: 2px solid var(--bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .day-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .day-badge {
            background: var(--primary);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .day-location {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .day-body {
            padding: 25px;
        }

        .item {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px dashed #e0e0e0;
        }

        .item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .item-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .cn-box {
            background: #fff5f5;
            border-left: 4px solid var(--primary);
            padding: 12px 16px;
            border-radius: 8px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .cn-text {
            font-size: 0.95rem;
            color: #4a5568;
        }

        .cn-text strong {
            color: var(--primary-dark);
            font-size: 1.05rem;
            display: block;
            margin-bottom: 2px;
        }

        .btn-copy {
            background: #fff;
            border: 1px solid var(--primary);
            color: var(--primary);
